name: Update publications from ORCID

on:
  workflow_dispatch:
  schedule:
    # Run every morning at 05:15 UTC. Adjust as needed.
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate publications page
        run: python3 tools/generate_publications_from_orcid.py

      - name: Commit updated publications page
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update publications from ORCID'
          file_pattern: publications.html
